<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>نظام حضور - فرق كاهوت</title>
  <style>
    :root{--accent:#276ef1;--bg:#0f1720;--card:#0b1220;--muted:#94a3b8}
    *{box-sizing:border-box;font-family:Inter, system-ui, Arial, sans-serif}
    body{margin:0;background:linear-gradient(180deg,#071021 0%, #07182a 100%);color:#e6eef8}
    .app{max-width:1100px;margin:28px auto;padding:20px}
    header{display:flex;gap:16px;align-items:center;margin-bottom:18px}
    h1{margin:0;font-size:20px}
    .layout{display:grid;grid-template-columns:280px 1fr;gap:18px}
    .card{background:rgba(255,255,255,0.03);padding:14px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    /* sidebar */
    .teams{display:flex;flex-direction:column;gap:10px}
    .team-item{padding:10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
    .team-item.active{background:linear-gradient(90deg, rgba(39,110,241,0.14), rgba(39,110,241,0.06));border:1px solid rgba(39,110,241,0.18)}
    .controls{display:flex;gap:8px;margin-top:8px}
    input,select,button,textarea{font-size:14px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit}
    button{cursor:pointer;background:var(--accent);border:none;color:white}
    .small{padding:6px 8px;font-size:13px}
    /* main */
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
    .members{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .member{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);padding:10px;border-radius:10px}
    .member h3{margin:0 0 6px 0;font-size:15px}
    .member .meta{font-size:13px;color:var(--muted)}
    .present{background:#074f0a;color:#d6ffcb}
    .absent{background:#4a0b0b;color:#ffd2d2}
    .row{display:flex;gap:8px;align-items:center}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .stat{background:rgba(255,255,255,0.02);padding:10px;border-radius:8px;min-width:120px}
    footer{margin-top:16px;color:var(--muted);font-size:13px}
    @media(max-width:800px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>نظام حضور وفرق كاهوت — نسخة سريعة</h1>
      <div style="margin-inline-start:auto;color:var(--muted)">بإمكانك حفظ الملف وفتحه أونلاين — يعمل بدون سيرفر (localStorage)</div>
    </header>

    <div class="layout">
      <aside class="card">
        <h3>الفرق (Kahoot Teams)</h3>
        <div class="teams" id="teamsList"></div>

        <div style="margin-top:10px">
          <input id="teamName" placeholder="اسم الفرقة (مثال: الفرقة أ)" />
          <div class="controls">
            <button id="addTeamBtn" class="small">إضافة فرقة</button>
            <button id="exportBtn" class="small">تصدير CSV</button>
          </div>
        </div>

        <hr style="margin:12px 0;border-color:rgba(255,255,255,0.03)"/>
        <h4>اعدادات سريعة</h4>
        <div style="font-size:13px;color:var(--muted)">اضغط على فرقة لتفعيلها. يمكنك اضافة خادم (Leader) ومخدومين (Members) داخل الفرقة.</div>
      </aside>

      <main>
        <div class="card">
          <div class="toolbar">
            <div>
              <strong id="activeTeamTitle">لا توجد فرقة محددة</strong>
              <div id="activeTeamCount" style="font-size:13px;color:var(--muted)"></div>
            </div>
            <div class="row">
              <input id="memberName" placeholder="اسم المخدوم" />
              <select id="memberRole">
                <option value="member">مخدوم</option>
                <option value="leader">خادم</option>
              </select>
              <button id="addMemberBtn" class="small">إضافة</button>
            </div>
          </div>

          <div class="members" id="membersGrid"></div>

          <div class="stats" id="teamStats"></div>

          <hr style="margin:12px 0;border-color:rgba(255,255,255,0.03)"/>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="markAllPresent" class="small">تعيين الحضور لكل المخدومين</button>
            <button id="markAllAbsent" class="small">تعيين الغياب لكل المخدومين</button>
            <button id="clearAttendance" class="small">مسح سجلات اليوم</button>
          </div>

        </div>

        <div class="card" style="margin-top:12px">
          <h3>سجل الحضور (التواريخ)</h3>
          <div id="attendanceLog" style="font-size:13px;color:var(--muted)"></div>
        </div>

      </main>
    </div>
  </div>

  <script>
    // Data model + persistence
    const STORAGE_KEY = 'kahoot_attendance_v1';
    const todayKey = () => new Date().toISOString().slice(0,10);

    let state = { teams: [] };

    // helpers
    const load = () => {
      try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) state = JSON.parse(raw); else {
        // seed sample
        state = { teams: [ {id:genId(), name:'الفرقة أ', members:[{id:genId(),name:'أحمد',role:'leader',stats:{}},{id:genId(),name:'محمد',role:'member',stats:{}},{id:genId(),name:'سارة',role:'member',stats:{}}], attendance:{}} ] };
        save();
      }}catch(e){console.error(e)}
    }
    const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const genId = () => Math.random().toString(36).slice(2,9);

    // UI elements
    const teamsList = document.getElementById('teamsList');
    const addTeamBtn = document.getElementById('addTeamBtn');
    const teamNameInput = document.getElementById('teamName');
    const activeTeamTitle = document.getElementById('activeTeamTitle');
    const activeTeamCount = document.getElementById('activeTeamCount');
    const memberNameInput = document.getElementById('memberName');
    const memberRoleSelect = document.getElementById('memberRole');
    const addMemberBtn = document.getElementById('addMemberBtn');
    const membersGrid = document.getElementById('membersGrid');
    const teamStats = document.getElementById('teamStats');
    const markAllPresent = document.getElementById('markAllPresent');
    const markAllAbsent = document.getElementById('markAllAbsent');
    const clearAttendance = document.getElementById('clearAttendance');
    const attendanceLog = document.getElementById('attendanceLog');
    const exportBtn = document.getElementById('exportBtn');

    let activeTeamId = null;

    // render
    function renderTeams(){
      teamsList.innerHTML = '';
      state.teams.forEach(t=>{
        const el = document.createElement('div');
        el.className = 'team-item' + (t.id===activeTeamId? ' active':'');
        el.innerHTML = `<div style="display:flex;gap:8px;align-items:center"><strong>${t.name}</strong><div style='font-size:12px;color:var(--muted)'>${t.members.length} مخدوم</div></div><div><button data-id='${t.id}' class='small'>حذف</button></div>`;
        el.onclick = (e)=>{ if(e.target.tagName==='BUTTON'){ removeTeam(t.id); } else { setActiveTeam(t.id); } }
        teamsList.appendChild(el);
      })
    }

    function setActiveTeam(id){ activeTeamId = id; render(); }

    function addTeam(name){ if(!name) return alert('اكتب اسم الفرقة'); state.teams.push({id:genId(),name, members:[], attendance:{}}); save(); renderTeams(); teamNameInput.value=''; }
    function removeTeam(id){ if(!confirm('هل تريد حذف الفرقة؟ هذا يحذف كل البيانات المتعلقة بها.')) return; state.teams = state.teams.filter(t=>t.id!==id); if(activeTeamId===id) activeTeamId=null; save(); render(); }

    function addMemberToActive(name, role){ if(!activeTeamId) return alert('اختر فرقة أولا'); if(!name) return alert('اكتب اسم المخدوم'); const t = state.teams.find(x=>x.id===activeTeamId); t.members.push({id:genId(),name,role,stats:{}}); save(); render(); memberNameInput.value=''; }

    function render(){
      renderTeams();
      const team = state.teams.find(t=>t.id===activeTeamId);
      if(!team){ activeTeamTitle.textContent = 'لا توجد فرقة محددة'; activeTeamCount.textContent='اختر فرقة من الجنب'; membersGrid.innerHTML=''; teamStats.innerHTML=''; attendanceLog.innerHTML=''; return; }
      activeTeamTitle.textContent = team.name;
      activeTeamCount.textContent = `${team.members.length} مخدوم`;

      // members
      membersGrid.innerHTML='';
      team.members.forEach(m=>{
        const mdiv = document.createElement('div'); mdiv.className='member card';
        const todays = team.attendance && team.attendance[todayKey()] ? (team.attendance[todayKey()][m.id] || 'unknown') : 'unknown';
        mdiv.innerHTML = `
          <h3>${m.name} ${m.role==='leader' ? '🟢 خادم':''}</h3>
          <div class='meta'>الحضور اليوم: <strong>${todays}</strong></div>
          <div style='margin-top:8px;display:flex;gap:8px'>
            <button class='small' data-action='present' data-mid='${m.id}'>حاضر</button>
            <button class='small' data-action='absent' data-mid='${m.id}'>غايب</button>
            <button class='small' data-action='toggle' data-mid='${m.id}'>تبديل</button>
            <button class='small' data-action='remove' data-mid='${m.id}'>حذف</button>
          </div>
          <div style='margin-top:8px;font-size:13px;color:var(--muted)'>حضور: ${getCount(team,m.id,'present')} | غياب: ${getCount(team,m.id,'absent')}</div>
        `;
        mdiv.querySelectorAll('button').forEach(btn=>{
          btn.addEventListener('click',(e)=>{
            const action = btn.dataset.action; const mid = btn.dataset.mid;
            if(action==='present') setAttendance(team.id, mid, 'present');
            if(action==='absent') setAttendance(team.id, mid, 'absent');
            if(action==='toggle') toggleAttendance(team.id, mid);
            if(action==='remove') removeMember(team.id, mid);
          })
        })
        membersGrid.appendChild(mdiv);
      })

      // team stats
      teamStats.innerHTML='';
      const presentCount = countTeamToday(team, 'present');
      const absentCount = countTeamToday(team, 'absent');
      const total = team.members.length;
      const statHtml = `
        <div class='stat'><strong>حاضر اليوم</strong><div style='font-size:18px'>${presentCount}</div></div>
        <div class='stat'><strong>غائب اليوم</strong><div style='font-size:18px'>${absentCount}</div></div>
        <div class='stat'><strong>اجمالي مخدومين</strong><div style='font-size:18px'>${total}</div></div>
      `;
      teamStats.innerHTML = statHtml;

      // attendance log
      attendanceLog.innerHTML = renderAttendanceLog(team);
    }

    function getTodayAttendance(team){ team.attendance = team.attendance || {}; team.attendance[todayKey()] = team.attendance[todayKey()] || {}; return team.attendance[todayKey()]; }
    function setAttendance(teamId, memberId, status){ const team = state.teams.find(t=>t.id===teamId); if(!team) return; const today = getTodayAttendance(team); today[memberId] = status; save(); render(); }
    function toggleAttendance(teamId,memberId){ const team = state.teams.find(t=>t.id===teamId); const today = getTodayAttendance(team); today[memberId] = today[memberId]==='present' ? 'absent' : 'present'; save(); render(); }

    function removeMember(teamId, memberId){ const team = state.teams.find(t=>t.id===teamId); team.members = team.members.filter(m=>m.id!==memberId); // also remove attendance
      Object.keys(team.attendance||{}).forEach(d=>{ if(team.attendance[d]) delete team.attendance[d][memberId]; }); save(); render(); }

    function getCount(team, memberId, status){ let count=0; Object.values(team.attendance||{}).forEach(day=>{ if(day && day[memberId]===status) count++; }); return count }
    function countTeamToday(team, status){ const today = team.attendance && team.attendance[todayKey()] ? team.attendance[todayKey()] : {}; return Object.values(today).filter(v=>v===status).length }

    function renderAttendanceLog(team){ const days = Object.keys(team.attendance||{}).sort((a,b)=>b.localeCompare(a)); if(days.length===0) return '<div style="color:var(--muted)">لا يوجد سجلات بعد</div>';
      return days.map(d=>{
        const entries = team.attendance[d];
        const lines = team.members.map(m=>{
          const val = entries && entries[m.id] ? entries[m.id] : 'unknown';
          return `${m.name} — ${val}`;
        }).join('<br>');
        return `<div style="margin-bottom:8px"><strong>${d}</strong><div style='color:var(--muted);margin-top:6px'>${lines}</div></div>`;
      }).join('');
    }

    function removeTeamAttendanceDay(teamId, day){ const team = state.teams.find(t=>t.id===teamId); if(team && team.attendance){ delete team.attendance[day]; save(); render(); } }

    // bulk actions
    function markAll(teamId, status){ const team = state.teams.find(t=>t.id===teamId); const today = getTodayAttendance(team); team.members.forEach(m=> today[m.id]=status); save(); render(); }
    function clearToday(teamId){ const team = state.teams.find(t=>t.id===teamId); if(team && team.attendance){ delete team.attendance[todayKey()]; save(); render(); } }

    // export CSV of attendance history for active team
    function exportCSV(){ if(!activeTeamId) return alert('اختر فرقة اولا'); const team = state.teams.find(t=>t.id===activeTeamId); const days = Object.keys(team.attendance||{}).sort(); const header = ['name','role',...days];
      const rows = team.members.map(m=>{
        const row = [m.name, m.role]; days.forEach(d=>{ row.push((team.attendance[d] && team.attendance[d][m.id]) || ''); }); return row.join(',');
      });
      const csv = [header.join(','), ...rows].join('\n');
      const blob = new Blob([csv], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${team.name}_attendance.csv`; a.click(); URL.revokeObjectURL(url);
    }

    // events
    addTeamBtn.addEventListener('click', ()=>addTeam(teamNameInput.value.trim()));
    addMemberBtn.addEventListener('click', ()=>addMemberToActive(memberNameInput.value.trim(), memberRoleSelect.value));
    markAllPresent.addEventListener('click', ()=>{ if(!activeTeamId) return alert('اختر فرقة'); markAll(activeTeamId,'present'); });
    markAllAbsent.addEventListener('click', ()=>{ if(!activeTeamId) return alert('اختر فرقة'); markAll(activeTeamId,'absent'); });
    clearAttendance.addEventListener('click', ()=>{ if(!activeTeamId) return alert('اختر فرقة'); if(confirm('مسح سجلات اليوم فقط؟')) clearToday(activeTeamId); });
    exportBtn.addEventListener('click', exportCSV);

    // init
    load(); if(state.teams.length>0) activeTeamId = state.teams[0].id; render();

  </script>
</body>
</html>
